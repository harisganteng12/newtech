<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Newtech Alpha | Pro Terminal</title>
    <link rel="stylesheet" href="style.css">
    <link rel="stylesheet" href="journal.css">
    
    <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;600;800&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
</head>
<body>

<div class="layout">
    <aside class="sidebar">
        <div class="brand"><i class="fas fa-cube"></i> NEWTECH</div>
        <ul class="nav-menu">
            <li class="nav-item active" onclick="nav('dashboard', this)"><i class="fas fa-chart-line"></i> Analytics Hub</li>
            <li class="nav-item" onclick="nav('swap', this)"><i class="fas fa-random"></i> Liquidity Swap</li>
            <li class="nav-item" onclick="nav('risk', this)"><i class="fas fa-calculator"></i> Risk Calculator</li>
            <li class="nav-item" onclick="nav('journal', this)"><i class="fas fa-book"></i> Trading Journal</li>
        </ul>
        <div id="auth-sidebar" style="margin-top: auto;"></div>
    </aside>

    <main class="main-content">
        <section id="dashboard" class="page active">...</section>
        <section id="swap" class="page">...</section>
        <section id="risk" class="page">...</section>

        <section id="journal" class="page">
            <h2 style="margin-bottom:25px;">Alpha Journaling System</h2>
            <div class="stat-row">
                <div class="stat-card"><label>Winrate</label><h2 id="jr-wr">0%</h2></div>
                <div class="stat-card"><label>Total P&L %</label><h2 id="jr-pl" style="color:var(--accent)">0.00%</h2></div>
                <div class="stat-card"><label>Avg RRR</label><h2 id="jr-rrr">0.00</h2></div>
            </div>

            <div class="grid-main">
                <div class="left-col">
                    <div class="card journal-card">
                        <h3>Running Positions</h3>
                        <div id="running-trades-container" style="margin-top:15px;">
                            </div>
                    </div>
                    <div class="card journal-card">
                        <h3>Trade History</h3>
                        <div class="table-scroll">
                            <table>
                                <thead><tr><th>DATE</th><th>PAIR</th><th>G/L%</th><th>RRR</th><th>DEL</th></tr></thead>
                                <tbody id="history-body"></tbody>
                            </table>
                        </div>
                    </div>
                </div>
                <div class="right-col">
                    <div class="card journal-card">
                        <h3>Log New Position</h3>
                        <label>Pair</label><input type="text" id="jr-pair" placeholder="BTCUSD">
                        <label>Modal ($)</label><input type="number" id="jr-modal" placeholder="1000">
                        <label>RPT ($)</label><input type="number" id="jr-rpt" placeholder="10">
                        <label>Target TP ($)</label><input type="number" id="jr-tp" placeholder="25">
                        <label>Margin Used ($)</label><input type="number" id="jr-margin" placeholder="50">
                        <button class="btn-action" onclick="saveTrade()">Open Position</button>
                    </div>
                </div>
            </div>
        </section>
    </main>
</div>

<script>
// --- CONFIG SUPABASE ---
const SB_URL = "URL_SUPABASE_LO";
const SB_KEY = "KEY_ANON_LO";
const supabase = libsupabase.createClient(SB_URL, SB_KEY);

// Fungsi Navigasi (Update dari fungsi asli lo)
function nav(id, el) {
    document.querySelectorAll('.page').forEach(p => p.classList.remove('active'));
    document.querySelectorAll('.nav-item').forEach(n => n.classList.remove('active'));
    document.getElementById(id).classList.add('active');
    el.classList.add('active');
    if(id === 'journal') fetchJournal(); // Tarik data pas buka menu journal
}

// --- FUNGSI UTAMA JURNAL ---
async function saveTrade() {
    const data = {
        pair: document.getElementById('jr-pair').value.toUpperCase(),
        modal_awal: parseFloat(document.getElementById('jr-modal').value),
        rpt_nominal: parseFloat(document.getElementById('jr-rpt').value),
        target_tp: parseFloat(document.getElementById('jr-tp').value),
        margin: parseFloat(document.getElementById('jr-margin').value),
        status: 'running'
    };
    const { error } = await supabase.from('trades').insert([data]);
    if(error) alert("Error: " + error.message);
    else { fetchJournal(); resetInputs(); }
}

async function fetchJournal() {
    const { data, error } = await supabase.from('trades').select('*').order('created_at', {ascending: false});
    if(error) return;

    let runHtml = '';
    let histHtml = '';
    let totalGL = 0, wins = 0, closedCount = 0, totalRRR = 0;

    data.forEach(tr => {
        if(tr.status === 'running') {
            runHtml += `
            <div class="res-container journal-run-item">
                <div class="run-info">
                    <span class="run-pair">${tr.pair}</span>
                    <span class="run-sub">Risk: $${tr.rpt_nominal} | Margin: $${tr.margin}</span>
                </div>
                <div class="run-actions">
                    <button class="btn-win" onclick="closeTr('${tr.id}','win',${tr.target_tp},${tr.modal_awal},${tr.rpt_nominal})">WIN</button>
                    <button class="btn-lose" onclick="closeTr('${tr.id}','lose',0,${tr.modal_awal},${tr.rpt_nominal})">LOSE</button>
                </div>
            </div>`;
        } else {
            closedCount++;
            if(tr.gl_percent > 0) wins++;
            totalGL += parseFloat(tr.gl_percent);
            totalRRR += parseFloat(tr.rrr_actual);
            histHtml += `
            <tr>
                <td>${new Date(tr.created_at).toLocaleDateString()}</td>
                <td><b>${tr.pair}</b></td>
                <td style="color:${tr.gl_percent > 0 ? 'var(--success)' : 'var(--danger)'}">${tr.gl_percent}%</td>
                <td>${tr.rrr_actual}</td>
                <td><i class="fas fa-trash-alt del-btn" onclick="delTr('${tr.id}')"></i></td>
            </tr>`;
        }
    });

    document.getElementById('running-trades-container').innerHTML = runHtml || '<p style="color:var(--text-dim); font-size:0.8rem;">No active positions</p>';
    document.getElementById('history-body').innerHTML = histHtml;
    document.getElementById('jr-wr').innerText = closedCount ? ((wins/closedCount)*100).toFixed(1) + "%" : "0%";
    document.getElementById('jr-pl').innerText = totalGL.toFixed(2) + "%";
    document.getElementById('jr-rrr').innerText = closedCount ? (totalRRR/closedCount).toFixed(2) : "0.00";
}

async function closeTr(id, res, tp, modal, rpt) {
    const gl = res === 'win' ? (tp/modal)*100 : (-rpt/modal)*100;
    const rrr = res === 'win' ? (tp/rpt).toFixed(2) : -1.0;
    await supabase.from('trades').update({ status: 'closed', gl_percent: gl.toFixed(2), rrr_actual: rrr }).eq('id', id);
    fetchJournal();
}

async function delTr(id) {
    if(confirm('Delete this record?')) { await supabase.from('trades').delete().eq('id', id); fetchJournal(); }
}

function resetInputs() {
    ['jr-pair','jr-modal','jr-rpt','jr-tp','jr-margin'].forEach(id => document.getElementById(id).value = "");
}

// Masukkan sisa JS asli lo di bawah sini (Chart, Wallet, Calc logic)...
</script>
</body>
</html>
