<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Newtech Alpha | Pro Terminal</title>
    <link rel="stylesheet" href="style.css">
    <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;600;800&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
</head>
<body>

<div class="layout">
    <aside class="sidebar">
        <div class="brand"><i class="fas fa-cube"></i> NEWTECH</div>
        <ul class="nav-menu">
            <li class="nav-item active" onclick="nav('dashboard', this)"><i class="fas fa-chart-line"></i> Analytics Hub</li>
            <li class="nav-item" onclick="nav('swap', this)"><i class="fas fa-random"></i> Liquidity Swap</li>
            <li class="nav-item" onclick="nav('risk', this)"><i class="fas fa-calculator"></i> Risk Calculator</li>
            <li class="nav-item" onclick="nav('journal', this)"><i class="fas fa-book"></i> Trading Journal</li>
        </ul>
    </aside>

    <main class="main-content">
        <section id="dashboard" class="page active">
            <div class="stat-row">
                <div class="stat-card"><label>Net Worth</label><h2>$124,084.12</h2></div>
                <div class="stat-card"><label>24h P&L</label><h2 style="color:var(--success)">+$4,210.00</h2></div>
                <div class="stat-card"><label>Gas Price</label><h2 style="color:#fbbf24">18 Gwei</h2></div>
            </div>
            <div class="grid-main">
                <div class="left-col">
                    <div class="card" style="padding:0; overflow:hidden;">
                        <div style="position:relative; padding-bottom:56.25%; height:0;">
                            <iframe style="position:absolute; top:0; left:0; width:100%; height:100%; border:none;" src="https://www.youtube.com/embed/dQDYLnP1ixo" allowfullscreen></iframe>
                        </div>
                    </div>
                    <div class="card">
                        <h3>Equity Performance</h3>
                        <div style="height:300px; margin-top:20px;"><canvas id="mainChart"></canvas></div>
                    </div>
                </div>
                <div class="right-col">
                    <div class="card">
                        <h3>Asset Inventory</h3>
                        <table>
                            <thead><tr><th>ASSET</th><th>VALUE</th></tr></thead>
                            <tbody>
                                <tr><td>BTC</td><td>$54,200</td></tr>
                                <tr><td>ETH</td><td>$42,100</td></tr>
                                <tr><td>USDT</td><td>$27,784</td></tr>
                            </tbody>
                        </table>
                    </div>
                </div>
            </div>
        </section>

        <section id="risk" class="page">
            <h2>Risk Engine</h2>
            <div class="calc-grid" style="display:grid; grid-template-columns:1fr 1fr; gap:20px; margin-top:20px;">
                <div class="card">
                    <h4>Calculator 1</h4>
                    <label>Wallet ($)</label><input type="number" id="c1-m">
                    <label>Risk ($)</label><input type="number" id="c1-r">
                    <button class="btn-action" onclick="alert('Kalkulasi Berhasil')">Calculate</button>
                </div>
            </div>
        </section>

        <section id="swap" class="page">
            <div class="card" style="max-width:400px; margin:auto;">
                <h3>Swap</h3>
                <input type="number" placeholder="0.0">
                <button class="btn-action">Swap Now</button>
            </div>
        </section>

        <section id="journal" class="page">
            <h2>Journal Log</h2>
            <div class="card">
                <p>Data Jurnal Trading lo bakal muncul di sini Bro.</p>
            </div>
        </section>
    </main>
</div>

<script>
    // Fungsi Navigasi - INI YANG BIKIN BISA DIKLIK
    function nav(pageId, element) {
        // 1. Sembunyiin semua halaman
        const pages = document.querySelectorAll('.page');
        pages.forEach(p => p.style.display = 'none');
        
        // 2. Tunjukin halaman yang dipilih
        const activePage = document.getElementById(pageId);
        if(activePage) {
            activePage.style.display = 'block';
        }

        // 3. Update style tombol di sidebar
        const navItems = document.querySelectorAll('.nav-item');
        navItems.forEach(item => item.classList.remove('active'));
        element.classList.add('active');
    }

    // Chart Asli
    const ctx = document.getElementById('mainChart').getContext('2d');
    new Chart(ctx, {
        type: 'line',
        data: {
            labels: ['W1', 'W2', 'W3', 'W4'],
            datasets: [{
                data: [100000, 115000, 108000, 124084],
                borderColor: '#00d4ff',
                fill: true,
                tension: 0.4
            }]
        },
        options: { responsive: true, maintainAspectRatio: false }
    });
</script>
</body>
</html>
